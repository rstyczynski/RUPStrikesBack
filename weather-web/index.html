<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weather WebUI</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" />
  <style>
    .hidden{display:none}
    .table{width:100%;border-collapse:collapse}
    .table th,.table td{border:1px solid #e5e7eb;padding:6px 8px;text-align:left}
  </style>
</head>
<body class="bg-gray-50 text-gray-900">
  <div class="max-w-3xl mx-auto p-4">
    <h1 class="text-3xl font-bold mb-4">Weather WebUI</h1>

    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700">API Base URL</label>
      <input id="apiBase" type="text" value="http://localhost:8080" class="mt-1 block w-full md:w-2/3 rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500" />
    </div>

    <div class="grid grid-cols-1 gap-4 mb-4">
      <div class="bg-white border border-gray-200 rounded-lg p-4">
        <label class="block text-sm font-medium text-gray-700">City</label>
        <div class="mt-1 flex items-center gap-2">
          <input id="city" type="text" placeholder="e.g. Tokyo" class="flex-1 rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500" />
          <button id="byCity" class="inline-flex items-center px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700">Get Weather</button>
        </div>
      </div>
      <div class="bg-white border border-gray-200 rounded-lg p-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-medium text-gray-700">Latitude</label>
            <input id="lat" type="text" placeholder="e.g. 37.7749" class="mt-1 w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Longitude</label>
            <input id="lon" type="text" placeholder="e.g. -122.4194" class="mt-1 w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500" />
          </div>
        </div>
        <div class="mt-3">
          <button id="byCoords" class="inline-flex items-center px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700">Get Weather</button>
        </div>
      </div>
    </div>

    <div id="error" class="hidden bg-red-100 text-red-700 border border-red-200 rounded p-3"></div>

    <div id="result" class="hidden space-y-4">
      <div id="location" class="hidden bg-white border border-gray-200 rounded-lg p-4"></div>
      <div id="current" class="hidden bg-white border border-gray-200 rounded-lg p-4"></div>
      <div id="forecast" class="hidden bg-white border border-gray-200 rounded-lg p-4"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
