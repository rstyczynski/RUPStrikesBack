<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weather WebUI</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>Weather WebUI</h1>

    <div class="config">
      <label>API Base URL
        <input id="apiBase" type="text" value="http://localhost:8080" />
      </label>
    </div>

    <div class="inputs">
      <div>
        <label>City
          <input id="city" type="text" placeholder="e.g. Tokyo" />
        </label>
        <button id="byCity">Get Weather</button>
      </div>
      <div>
        <label>Latitude
          <input id="lat" type="text" placeholder="e.g. 37.7749" />
        </label>
        <label>Longitude
          <input id="lon" type="text" placeholder="e.g. -122.4194" />
        </label>
        <button id="byCoords">Get Weather</button>
      </div>
    </div>

    <div id="error" class="error hidden"></div>

    <div id="result" class="result hidden">
      <div id="location" class="card hidden"></div>
      <div id="current" class="card hidden"></div>
      <div id="forecast" class="card hidden"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
