<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Weather Forecast</h1>
        </header>
        
        <div class="search-section">
            <div class="search-tabs">
                <button class="tab active" data-tab="city">Search by City</button>
                <button class="tab" data-tab="coord">Search by Coordinates</button>
            </div>
            
            <div id="city-search" class="search-form active">
                <input type="text" id="city-input" placeholder="Enter city name (e.g., Tokyo, San Francisco)">
                <button onclick="searchByCity()">Get Weather</button>
            </div>
            
            <div id="coord-search" class="search-form">
                <input type="number" id="lat-input" placeholder="Latitude (e.g., 37.77)" step="any">
                <input type="number" id="lon-input" placeholder="Longitude (e.g., -122.42)" step="any">
                <button onclick="searchByCoordinates()">Get Weather</button>
            </div>
        </div>
        
        <div id="error-message" class="error hidden"></div>
        
        <div id="loading" class="loading hidden">Loading weather data...</div>
        
        <div id="weather-display" class="weather-display hidden">
            <div class="location-info">
                <h2 id="location-name"></h2>
                <p id="location-details"></p>
            </div>
            
            <div class="current-weather">
                <h3>Current Weather</h3>
                <div class="current-temp">
                    <span id="current-temp"></span>°C
                </div>
                <div id="current-conditions"></div>
            </div>
            
            <div class="forecast">
                <h3>3-Day Forecast</h3>
                <div id="forecast-days" class="forecast-days"></div>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
