<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Weather WebUI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .hidden{display:none}
    .table{width:100%;border-collapse:collapse}
    .table th,.table td{border:1px solid #e5e7eb;padding:6px 8px;text-align:left}
    #map{height:320px}
  </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100" style="font-family: Inter, -apple-system, Segoe UI, Roboto, sans-serif">
  <div class="max-w-4xl mx-auto px-4 py-5">
    <header class="flex items-center justify-between mb-5">
      <div class="flex items-center gap-2">
        <span class="inline-flex h-8 w-8 items-center justify-center rounded bg-indigo-600 text-white">W</span>
        <h1 class="text-2xl font-semibold">Weather</h1>
      </div>
      <div class="flex items-center gap-2">
        <button id="toggleTheme" class="inline-flex items-center gap-2 rounded-md border border-gray-200 dark:border-gray-700 px-3 py-2 text-sm hover:bg-gray-100 dark:hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <span id="themeIcon" data-lucide="moon"></span>
          <span>Theme</span>
        </button>
      </div>
    </header>

    <section class="mb-4">
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">API Base URL</label>
      <input id="apiBase" type="text" value="http://localhost:8080" class="mt-1 block w-full md:w-2/3 rounded-md border-gray-300 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-100 shadow-sm focus:ring-indigo-500 focus:border-indigo-500" />
    </section>

    <div class="grid grid-cols-1 gap-4 mb-4">
      <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg p-4">
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">City</label>
        <div class="mt-1 flex items-center gap-2">
          <input id="city" type="text" placeholder="e.g. Tokyo" class="flex-1 rounded-md border-gray-300 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-100 shadow-sm focus:ring-indigo-500 focus:border-indigo-500" />
          <button id="byCity" class="inline-flex items-center px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 transform active:scale-[0.98] transition">Get Weather</button>
        </div>
      </div>
      <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg p-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Latitude</label>
            <input id="lat" type="text" placeholder="e.g. 37.7749" class="mt-1 w-full rounded-md border-gray-300 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-100 shadow-sm focus:ring-indigo-500 focus:border-indigo-500" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Longitude</label>
            <input id="lon" type="text" placeholder="e.g. -122.4194" class="mt-1 w-full rounded-md border-gray-300 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-100 shadow-sm focus:ring-indigo-500 focus:border-indigo-500" />
          </div>
        </div>
        <div class="mt-3">
          <button id="byCoords" class="inline-flex items-center px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 transform active:scale-[0.98] transition">Get Weather</button>
        </div>
      </div>
    </div>

    <div id="error" role="alert" aria-live="polite" class="hidden bg-red-100 dark:bg-red-900 text-red-700 dark:text-red-100 border border-red-200 dark:border-red-800 rounded p-3"></div>

    <div id="result" class="hidden space-y-4">
      <div id="skeleton" class="space-y-4">
        <div class="skeleton h-20"></div>
        <div class="skeleton h-24"></div>
        <div class="skeleton h-40"></div>
      </div>
      <div id="location" class="hidden bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg p-4"></div>
      <div id="current" class="hidden bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg p-4"></div>
      <div id="forecast" class="hidden bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg p-4"></div>
      <div id="map" class="hidden bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg p-1"></div>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
